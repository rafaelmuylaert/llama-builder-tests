version: "3.8"

services:
  llama-builder:
    build: .
    container_name: llama-builder
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=your_github_token_here
    volumes:
      - /path/to/config/folder:/app:ro
      - /path/to/output/folder:/output
      - /path/to/models/folder:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
